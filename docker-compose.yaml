name: breaktest

services:
  traefik:
    image: traefik:v3.7.11
    restart: unless-stopped
    command:
      - --api.dashboard=false
      - --api.insecure=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.forwardedheaders.trustedips=${TRAEFIK_TRUSTED_PROXY_IPS:-127.0.0.1/32,::1/128}
      - --certificatesresolvers.letsencrypt.acme.email=${LETS_ENCRYPT_EMAIL:-admin@example.com}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --log.level=${LOG_LEVEL:-INFO}
      - --accesslog=true
      - --ping=true
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_acme:/letsencrypt
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - breaktest-network
    security_opt:
      - no-new-privileges:true

  frontend:
    image: ${BREAKTEST_IMAGE_REGISTRY:-breakingit}/breaktest-frontend:${BREAKTEST_FRONTEND_VERSION:-${BREAKTEST_VERSION:?BREAKTEST_VERSION is not set - run via start.sh or pass --env-file version.env}}
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
    depends_on:
      backend:
        condition: service_healthy
      traefik:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1:3001/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - breaktest-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.breaktest-frontend.rule=${TRAEFIK_FRONTEND_RULE:-PathPrefix(`/`)}
      - traefik.http.routers.breaktest-frontend.entrypoints=${TRAEFIK_ENTRYPOINTS:-web}
      - traefik.http.routers.breaktest-frontend.priority=1
      - traefik.http.routers.breaktest-frontend.tls=${TRAEFIK_TLS:-false}
      - traefik.http.routers.breaktest-frontend.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.breaktest-frontend.loadbalancer.server.port=3001
    security_opt:
      - no-new-privileges:true

  backend:
    image: ${BREAKTEST_IMAGE_REGISTRY:-breakingit}/breaktest-backend:${BREAKTEST_BACKEND_VERSION:-${BREAKTEST_VERSION:?BREAKTEST_VERSION is not set - run via start.sh or pass --env-file version.env}}
    restart: unless-stopped
    env_file:
      - config.env
    environment:
      - AI_ASSISTANT_ENABLED=${AI_ASSISTANT_ENABLED:-false}
      - HERMES_URL=${HERMES_URL:-http://ai-assistant:8080}
      - HERMES_API_KEY=${HERMES_API_KEY:-breaktest-internal}
    volumes:
      - ${BACKUP_PATH:-./backups}:/backups
    depends_on:
      mongodb:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      pg-proxy:
        condition: service_started
      traefik:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3002/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - breaktest-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.breaktest-backend.rule=${TRAEFIK_BACKEND_RULE:-PathPrefix(`/api`)}
      - traefik.http.routers.breaktest-backend.entrypoints=${TRAEFIK_ENTRYPOINTS:-web}
      - traefik.http.routers.breaktest-backend.priority=100
      - traefik.http.routers.breaktest-backend.tls=${TRAEFIK_TLS:-false}
      - traefik.http.routers.breaktest-backend.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.breaktest-backend.loadbalancer.server.port=3002
      - traefik.http.routers.breaktest-websocket.rule=${TRAEFIK_WEBSOCKET_RULE:-PathPrefix(`/ws`)}
      - traefik.http.routers.breaktest-websocket.entrypoints=${TRAEFIK_ENTRYPOINTS:-web}
      - traefik.http.routers.breaktest-websocket.priority=200
      - traefik.http.routers.breaktest-websocket.service=breaktest-backend
      - traefik.http.routers.breaktest-websocket.tls=${TRAEFIK_TLS:-false}
      - traefik.http.routers.breaktest-websocket.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
    security_opt:
      - no-new-privileges:true

  mongodb:
    image: mongo:8.3.8
    restart: unless-stopped
    command: ["mongod", "--logpath", "/var/log/mongodb/mongodb.log"]
    environment:
      - TZ=${TZ:-UTC}
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db
      - mongodb_logs:/var/log/mongodb
    healthcheck:
      # An unauthenticated ping only proves that mongod is listening.  The
      # official image can leave a partially initialized database behind when
      # the host runs out of disk during first boot, so verify the credentials
      # that the backend will actually use.
      test: ["CMD-SHELL", "mongosh --quiet --host 127.0.0.1 --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"db.adminCommand({ping: 1}).ok\" | grep -q '^1$'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - breaktest-network
    security_opt:
      - no-new-privileges:true

  timescaledb:
    image: timescale/timescaledb:2.29.2-pg18
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - TIMESCALEDB_TELEMETRY=off
    volumes:
      - ${POSTGRES_DATA_PATH:-timescaledb_data}:/var/lib/postgresql
      - ${BACKUP_PATH:-./backups}:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-admin}\" -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - breaktest-network
    command:
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-100}
      - -c
      - timezone=${POSTGRES_TIMEZONE:-UTC}
      - -c
      - log_timezone=${POSTGRES_TIMEZONE:-UTC}
      - -c
      - fsync=${POSTGRES_FSYNC:-off}
      - -c
      - synchronous_commit=${POSTGRES_SYNCHRONOUS_COMMIT:-off}
      - -c
      - full_page_writes=${POSTGRES_FULL_PAGE_WRITES:-on}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-64MB}
    security_opt:
      - no-new-privileges:true

  pg-proxy:
    image: ${BREAKTEST_IMAGE_REGISTRY:-breakingit}/breaktest-pg-proxy:${BREAKTEST_PG_PROXY_VERSION:-${BREAKTEST_VERSION:?BREAKTEST_VERSION is not set - run via start.sh or pass --env-file version.env}}
    restart: unless-stopped
    environment:
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - MAX_INFLIGHT=${PG_PROXY_MAX_INFLIGHT:-512}
      - COPY_TIMEOUT_SEC=${PG_PROXY_COPY_TIMEOUT_SEC:-60}
      - PG_PROXY_MAX_CONNS=${PG_PROXY_MAX_CONNS:-100}
      - MAX_BODY_BYTES=${PG_PROXY_MAX_BODY_BYTES:-67108864}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/pg-proxy", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - breaktest-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.breaktest-pg-proxy.rule=${TRAEFIK_PG_PROXY_RULE:-PathPrefix(`/ingest`) || PathPrefix(`/upsert`)}
      - traefik.http.routers.breaktest-pg-proxy.entrypoints=${TRAEFIK_ENTRYPOINTS:-web}
      - traefik.http.routers.breaktest-pg-proxy.priority=150
      - traefik.http.routers.breaktest-pg-proxy.tls=${TRAEFIK_TLS:-false}
      - traefik.http.routers.breaktest-pg-proxy.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.breaktest-pg-proxy.loadbalancer.server.port=8080
    security_opt:
      - no-new-privileges:true

  ai-assistant:
    image: ${BREAKTEST_IMAGE_REGISTRY:-breakingit}/breaktest-ai-assistant:${BREAKTEST_AI_ASSISTANT_VERSION:-${BREAKTEST_VERSION:?BREAKTEST_VERSION is not set - run via start.sh or pass --env-file version.env}}
    profiles:
      - ai-assistant
    restart: unless-stopped
    env_file:
      - config.env
    environment:
      - HERMES_API_KEY=${HERMES_API_KEY:-breaktest-internal}
      - API_SERVER_KEY=${HERMES_API_KEY:-breaktest-internal}
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=8080
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_ACCESS_TOKEN=${OPENAI_ACCESS_TOKEN:-}
      - OPENAI_REFRESH_TOKEN=${OPENAI_REFRESH_TOKEN:-}
      - OPENAI_TOKEN_EXPIRES=${OPENAI_TOKEN_EXPIRES:-}
      - OPENAI_EMAIL=${OPENAI_EMAIL:-}
      - AI_MODEL=${AI_MODEL:-}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - breaktest-network
    volumes:
      - hermes_data:/home/hermes/.hermes
    security_opt:
      - no-new-privileges:true

  loadgenerator:
    image: ${BREAKTEST_IMAGE_REGISTRY:-breakingit}/breaktest-loadgenerator:${BREAKTEST_LOADGENERATOR_VERSION:-${BREAKTEST_VERSION:?BREAKTEST_VERSION is not set - run via start.sh or pass --env-file version.env}}
    profiles:
      - loadgenerator
    restart: unless-stopped
    # Reap zombie children (Chromium helpers detach and reparent to PID 1)
    init: true
    # Real /dev/shm for shared browsers in K6 Browser runs; without it the
    # agent falls back to slow disk-backed shared memory
    shm_size: 4gb
    # Zero means unlimited. In container mode these parent limits are also
    # propagated to each JMeter/K6 workload container.
    cpus: ${LOAD_GENERATOR_CPU_LIMIT:-0}
    mem_limit: ${LOAD_GENERATOR_MEMORY_LIMIT:-0}
    user: "${LOAD_GENERATOR_UID:-1000}:${LOAD_GENERATOR_GID:-1000}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - breaktest-network
    volumes:
      - ./loadgenerator/files:/files
      - /sys/class/net:/host/sys/class/net:ro
      - /sys/devices:/host/sys/devices:ro
      - /sys/fs/cgroup:/host/sys/fs/cgroup:ro
    environment:
      - TZ=${TZ:-UTC}
      - CONTROLLER_HOST=backend
      - CONTROLLER_PORT=3002
      - CONTROLLER_SSL=false
      - LOAD_GENERATOR_TOKEN=${LOAD_GENERATOR_TOKEN:-local-token}
      - LOAD_GENERATOR_TYPE=local
      - LOAD_GENERATOR_NAME=${LOAD_GENERATOR_NAME:-loadgenerator}
      - LOAD_GENERATOR_LOCATION=${LOAD_GENERATOR_LOCATION:-Local}
      - LOAD_GENERATOR_RUN_MODE=${LOAD_GENERATOR_RUN_MODE:-container}
      - HOST_TESTPLAN_PATH=${HOST_TESTPLAN_PATH:-/files}
      - CONTAINER_NETWORK=${LOAD_GENERATOR_CONTAINER_NETWORK:-breaktest-network}
      - LOAD_GENERATOR_WORKLOAD_IMAGE=${BREAKTEST_IMAGE_REGISTRY:-breakingit}/breaktest-loadgenerator:${BREAKTEST_LOADGENERATOR_VERSION:-${BREAKTEST_VERSION:?BREAKTEST_VERSION is not set - run via start.sh or pass --env-file version.env}}
      - PUBLIC=${LOAD_GENERATOR_PUBLIC:-true}
      - CUSTOMER_NAME=${LOAD_GENERATOR_CUSTOMER_NAME:-Default}
      - SUPPORTS_SYNTHETIC_MONITORING=${LOAD_GENERATOR_SUPPORTS_SYNTHETIC_MONITORING:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

  grafana:
    image: grafana/grafana:13.1.2
    profiles:
      - grafana
    user: "472:472"
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-}
      - GF_AUTH_PROXY_ENABLED=false
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_LIVE_MAX_CONNECTIONS=0
      - GF_SERVER_ENABLE_GZIP=true
      - GF_SECURITY_ALLOW_EMBEDDING=false
      - GF_SERVER_ROOT_URL=${BREAKTEST_PUBLIC_URL:-http://localhost}/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_DASHBOARDS_MIN_REFRESH_INTERVAL=1s
      - GF_DASHBOARD_CLEANUP_INTERVAL=8760h
      - GF_DATABASE_TYPE=sqlite3
      - GF_DATABASE_PATH=/var/lib/grafana/grafana.db
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - BT_POSTGRES_HOST=${POSTGRES_HOST:-timescaledb}
      - BT_POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - BT_POSTGRES_USER=${GRAFANA_MONITORING_DB_USER:-graf_breaktest_monitoring_ro}
      - BT_POSTGRES_PASSWORD=${GRAFANA_MONITORING_DB_PASSWORD:-}
    volumes:
      - grafana_data:/var/lib/grafana:rw
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      timescaledb:
        condition: service_healthy
      traefik:
        condition: service_started
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - breaktest-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.breaktest-grafana.rule=${TRAEFIK_GRAFANA_RULE:-PathPrefix(`/grafana`)}
      - traefik.http.routers.breaktest-grafana.entrypoints=${TRAEFIK_ENTRYPOINTS:-web}
      - traefik.http.routers.breaktest-grafana.priority=80
      - traefik.http.routers.breaktest-grafana.tls=${TRAEFIK_TLS:-false}
      - traefik.http.routers.breaktest-grafana.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.routers.breaktest-grafana.middlewares=breaktest-grafana-ipallowlist
      - traefik.http.middlewares.breaktest-grafana-ipallowlist.ipallowlist.sourcerange=${TRAEFIK_GRAFANA_IP_ALLOWLIST:-127.0.0.1/32,::1/128}
      - traefik.http.middlewares.breaktest-grafana-ipallowlist.ipallowlist.ipstrategy.depth=${TRAEFIK_GRAFANA_IP_STRATEGY_DEPTH:-0}
      - traefik.http.services.breaktest-grafana.loadbalancer.server.port=3000
    security_opt:
      - no-new-privileges:true

networks:
  breaktest-network:
    driver: bridge

volumes:
  mongodb_data:
  mongodb_logs:
  timescaledb_data:
  traefik_acme:
  hermes_data:
  grafana_data:
